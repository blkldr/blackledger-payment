<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE UNKNOWN // 30 DAYS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            border: 1px solid #113311;
            padding: 30px;
            background: #080808;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px dashed #113311;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .tagline {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .user-identity {
            background: #030303;
            border: 1px dashed #222;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            color: #888;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .room-card {
            background: #0c0c0c;
            border: 1px solid #222;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .room-card.unlocked {
            border-color: #00ff66;
            color: #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .room-card.locked {
            border-color: #331111;
            color: #555;
            cursor: not-allowed;
        }

        .room-card:hover:not(.locked) {
            background: #00ff66;
            color: #000;
        }

        .terminal-box {
            background: #000;
            border: 1px solid #222;
            padding: 20px;
            min-height: 160px;
            position: relative;
        }

        .terminal-title {
            font-size: 0.8rem;
            color: #444;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .terminal-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ccc;
        }

        .input-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #030303;
            border: 1px solid #333;
            padding: 10px;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #00ff66;
        }

        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        .share-box {
            margin-top: 12px;
            background: #050f05;
            border: 1px solid #113311;
            padding: 10px;
            font-size: 0.85rem;
            color: #00ff66;
            display: none;
            word-break: break-all;
        }

        .glitch {
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>THE UNKNOWN // 30 DAYS</h1>
            <div class="tagline">"You don't join it. You discover it."</div>
        </div>

        <div class="user-identity">
            <div>STATUS: <span id="userStatus" style="color:#00ff66;">WANDERER</span></div>
            <div>YOUR DUO KEY: <span id="userDuoKey" style="color:#fff; font-weight:bold;">UKN-7742</span></div>
        </div>

        <div class="rooms-grid" id="roomsGrid"></div>

        <div class="terminal-box">
            <div class="terminal-title" id="terminalTitle">SYSTEM STATUS: AWAITING INPUT</div>
            <div class="terminal-content" id="terminalContent">
                Select an unlocked room above to begin your descent. Room 01 is open to all wanderers.
            </div>
            <div class="input-group" id="inputGroup" style="display: none;">
                <input type="text" id="passcodeInput" placeholder="Enter room key or friend's Duo code...">
                <button onclick="verifyKey()">SUBMIT</button>
            </div>
            <div class="share-box" id="shareBox">
                Share this Duo code with a friend so they can enter: <b id="displayDuoCode">UKN-7742</b>
            </div>
        </div>
    </div>

    <script>
        const rooms = [
            { id: 1, name: "ROOM 01", status: "unlocked", desc: "The signal is faint. Clue: What year are we trying to escape from? (Hint: 2042)", locked: false, code: "2042" },
            { id: 2, name: "ROOM 02", status: "locked", desc: "DUO PROTOCOL: This room requires a partner. Enter a friend's Duo Pass code or crack the cipher.", locked: true, code: "DUO-99" },
            { id: 3, name: "ROOM 03", status: "locked", desc: "The Trust Game vault. Locked until system synchronization.", locked: true, code: "TRUST" },
            { id: 4, name: "ROOM 04", status: "locked", desc: "Encrypted Archive. Only accessible to active members.", locked: true, code: "UNKNOWN" },
            { id: 5, name: "ROOM 05", status: "locked", desc: "The Final Door. (Locked for 30 Days)", locked: true, code: "FINAL" }
        ];

        let currentActiveRoom = null;
        let myDuoCode = "UKN-" + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('userDuoKey').innerText = myDuoCode;
        document.getElementById('displayDuoCode').innerText = myDuoCode;

        function renderRooms() {
            const grid = document.getElementById('roomsGrid');
            grid.innerHTML = '';
            rooms.forEach(room => {
                const card = document.createElement('div');
                card.className = `room-card ${room.locked ? 'locked' : 'unlocked'}`;
                card.innerHTML = `<div>${room.name}</div><div style="font-size:0.7rem; margin-top:5px;">${room.locked ? '◼ LOCKED' : '✓ OPEN'}</div>`;
                card.onclick = () => selectRoom(room.id);
                grid.appendChild(card);
            });
        }

        function selectRoom(id) {
            const room = rooms.find(r => r.id === id);
            currentActiveRoom = room;
            const title = document.getElementById('terminalTitle');
            const content = document.getElementById('terminalContent');
            const inputGroup = document.getElementById('inputGroup');
            const shareBox = document.getElementById('shareBox');

            title.innerText = `ACCESSING: ${room.name}`;
            
            if (room.locked) {
                content.innerHTML = `<span class="glitch" style="color:#ff3333;">ACCESS DENIED.</span><br>${room.desc}<br><br>Override with security key or friend's Duo code:`;
                inputGroup.style.display = 'flex';
                shareBox.style.display = 'none';
            } else {
                content.innerHTML = `${room.desc}<br><br><span style="color:#00ff66;">[Status: Unlocked successfully]</span>`;
                inputGroup.style.display = 'none';
                if(room.id === 1) {
                    shareBox.style.display = 'block';
                } else {
                    shareBox.style.display = 'none';
                }
            }
        }

        function verifyKey() {
            const val = document.getElementById('passcodeInput').value.trim();
            if (currentActiveRoom && (val === currentActiveRoom.code || val.startsWith("UKN-"))) {
                currentActiveRoom.locked = false;
                currentActiveRoom.status = "unlocked";
                alert("ACCESS GRANTED. The system acknowledges your partnership/key.");
                document.getElementById('passcodeInput').value = '';
                document.getElementById('userStatus').innerText = "SYNCHRONIZED";
                renderRooms();
                selectRoom(currentActiveRoom.id);
            } else {
                alert("INVALID KEY. Check your clues or ask your friend for their Duo pass.");
            }
        }

        renderRooms();
    </script>
</body>
</html>
